{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-5">
                <h3 class="card-title text-center mb-2">Create a community space</h3>
                <p class="text-muted text-center mb-4">Set up a shared place for your group to report issues and coordinate support.</p>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Community or organization name</label>
                        <input type="text" name="campus_name" class="form-control" required maxlength="150" placeholder="e.g. Riverside Neighborhood Association">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Community type</label>
                        <select name="organization_type" class="form-select" required>
                            {% for value, label in organization_types.items() %}
                            <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <hr class="my-4">
                    <div class="mb-3">
                        <label class="form-label">Your name</label>
                        <input type="text" name="admin_name" class="form-control" required maxlength="100" autocomplete="name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Your email</label>
                        <input type="email" name="admin_email" class="form-control" required maxlength="150" autocomplete="email" placeholder="you@example.org">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create community space</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('campus_login') }}" class="text-decoration-none">Already have an access code? Admin login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
