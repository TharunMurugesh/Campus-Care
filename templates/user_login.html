{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-5">
                <h3 class="card-title text-center mb-2">Member & Staff Login</h3>
                <p class="text-muted text-center mb-4">Use the email address your community admin added.</p>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" required autocomplete="username" placeholder="you@example.org">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Community access code <span class="text-muted">(if you belong to more than one)</span></label>
                        <input type="text" name="community_code" class="form-control" autocomplete="off" placeholder="CCYYYYNNNN">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
